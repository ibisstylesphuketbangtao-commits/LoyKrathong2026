<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loy Krathong Online</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&family=Philosopher:wght@400;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sky:#0b1530;--river:#0f3a4a;--gold:#ffc65a;--ember:#ff8a3d;--ink:#f6efe0;--panel:rgba(10,20,40,.82);--line:rgba(255,198,90,.35);color-scheme:dark;--fd:Mitr,sans-serif;--fb:Sarabun,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#0b1530;--river:#0f3a4a}}
:root[data-theme="dark"]{--sky:#0b1530;--river:#0f3a4a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--fb);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}
h1{font-family:var(--fd);font-weight:500;font-size:clamp(22px,5vw,34px);margin:0;line-height:1.15;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.sub{font-size:14px;opacity:.8;margin-top:4px}
.count{font-family:var(--fd);font-size:14px;margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.7)}.logo{background:rgba(255,255,255,.95);border-radius:10px;padding:6px 10px;min-height:44px;display:flex;align-items:center;flex:none}.logo:has(img:not([style*="none"])){background:none;padding:0;min-height:0}.logo img{height:56px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}.logo .fb{font-family:var(--fd);color:#1b2b5e;font-size:20px;line-height:1;text-align:right}.logo .fb b{font-weight:500}.logo .fb small{display:block;font-size:10px;margin-top:3px;opacity:.7;font-family:var(--fb)}
.count b{font-size:22px;font-weight:500;color:var(--gold);margin-right:6px}
.panel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(10px);max-height:calc(100% - 110px);overflow:auto;transition:opacity .4s,transform .4s}
.panel.hide{opacity:0;transform:translate(-50%,30px);pointer-events:none}
label{display:block;font-size:14px;margin:12px 0 6px}
label:first-child{margin-top:0}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:none;height:76px}
input:focus,textarea:focus,button:focus-visible,.opt input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;font-size:14px;cursor:pointer}
.opt i{width:26px;height:26px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;display:block}
.opt input:checked+span{border-color:var(--gold);background:rgba(255,198,90,.15)}
button.go,button.again{font-family:var(--fd);font-size:18px;width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--gold),var(--ember));color:#2a1200;cursor:pointer}
button.go:active{transform:scale(.98)}
button.again{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);width:auto;padding:12px 26px;margin:0;display:none;box-shadow:0 6px 24px rgba(255,138,61,.45)}
button.again.show{display:block}
.tip,.toast{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;max-width:240px;opacity:0;transition:opacity .3s}
.tip.on,.toast.on{opacity:1}
.toast{left:50%;top:22%;transform:translateX(-50%);text-align:center;max-width:300px;font-size:15px}
.opt em{font-style:normal}.lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);right:16px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}.lang button{font:600 13px var(--fb);color:var(--ink);background:none;border:0;border-radius:999px;padding:5px 10px;cursor:pointer}.lang button[aria-pressed=true]{background:var(--gold);color:#2a1200}.lang button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.hint{font-size:12px;opacity:.65;text-align:center;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
